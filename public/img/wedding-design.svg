<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F5F0"/>
      <stop offset="100%" stop-color="#D4E8E4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  
  <!-- Top flourish -->
  <path d="M300 80 Q400 40 500 80" fill="none" stroke="#2D5F57" stroke-width="2" opacity="0.6"/>
  <circle cx="400" cy="60" r="3" fill="#2D5F57"/>
  
  <!-- Names -->
  <text x="400" y="280" text-anchor="middle" font-family="Garamond, serif" font-size="72" fill="#2D5F57" letter-spacing="2">Erda</text>
  <text x="400" y="370" text-anchor="middle" font-family="Brush Script MT, cursive" font-size="80" fill="#2D5F57" font-style="italic">&</text>
  <text x="400" y="460" text-anchor="middle" font-family="Garamond, serif" font-size="72" fill="#2D5F57" letter-spacing="2">Faton</text>
  
  <!-- Divider -->
  <line x1="250" y1="540" x2="550" y2="540" stroke="#2D5F57" stroke-width="1.5" opacity="0.7"/>
  <circle cx="400" cy="540" r="4" fill="#2D5F57"/>
  
  <!-- Date -->
  <text x="400" y="600" text-anchor="middle" font-family="Garamond, serif" font-size="22" fill="#2D5F57" letter-spacing="3">OCTOBER 3, 2026</text>
  <text x="400" y="630" text-anchor="middle" font-family="Garamond, serif" font-size="18" fill="#2D5F57" letter-spacing="2" opacity="0.8">Sarandë, Albania</text>
  
  <!-- Subtitle -->
  <text x="400" y="700" text-anchor="middle" font-family="Garamond, serif" font-size="16" fill="#2D5F57" letter-spacing="4" text-transform="lowercase">wedding celebration</text>
  
  <!-- Olive branches -->
  <ellipse cx="280" cy="600" rx="60" ry="30" fill="none" stroke="#3A7A6E" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="520" cy="600" rx="60" ry="30" fill="none" stroke="#3A7A6E" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Bottom flourish -->
  <path d="M300 920 Q400 960 500 920" fill="none" stroke="#2D5F57" stroke-width="2" opacity="0.6"/>
  <circle cx="400" cy="940" r="3" fill="#2D5F57"/>
